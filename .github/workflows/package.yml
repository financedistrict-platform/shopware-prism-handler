name: Package

# Validate the plugin against Shopware store-compliance + structure checks and build the
# installable FdPrismPayment.zip. The zip is uploaded as a workflow artifact on every run; pushing
# a version tag (v*) also attaches it to a GitHub Release.
#
# Runs inside the official shopware-cli image (has shopware-cli + git + node). The zip is built in
# git mode (default), so only tracked files are packaged — .docs/ and other gitignored scratch are
# excluded automatically.

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the zip to a Release on tag pushes

jobs:
  package:
    runs-on: ubuntu-latest
    # Pinned, not `latest-php-8.3`: that tag moves, and a CLI released on 2026-10-06 changed
    # `extension validate` in a way that broke this job on untouched commits (#27). Bump
    # deliberately so the next behaviour change lands in a PR rather than mid-review.
    container: ghcr.io/shopware/shopware-cli:0.19.1-php-8.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags + full history so shopware-cli can resolve the version

      # The checkout is owned by a different uid inside the container; mark it safe for git.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # phpstan is excluded because it cannot run here, not to silence it: the checker resolves the
      # extension's composer dependencies, and shopware/agentic-commerce is the licensed base plugin
      # — not on Packagist, and not publishable. Even with it resolved, analysing our decorators
      # needs that plugin's classes. PHP coverage comes from the `core-tests` workflow instead,
      # which runs PHPUnit against the stubs in tests/Support.
      - name: Validate extension
        run: shopware-cli extension validate . --exclude phpstan

      # Absolute output dir: git mode checks the source out into a temp working dir, so a
      # relative --output-directory would land there instead of the workspace.
      - name: Build zip
        run: shopware-cli extension zip . --release --output-directory "$GITHUB_WORKSPACE/.build"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: FdPrismPayment-zip
          path: .build/*.zip
          if-no-files-found: error
          include-hidden-files: true  # the zip lives under .build/ (dot-prefixed); v4 skips hidden paths by default

      - name: Attach zip to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: .build/*.zip
