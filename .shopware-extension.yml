# Pin shopware-cli behaviour to a known date (silences the default-date warning).
compatibility_date: '2026-02-11'

# shopware-cli build config for `shopware-cli extension zip`.
#
# composer: disabled — no third-party composer deps (shopware/core + the licensed
# shopware/agentic-commerce are provided at runtime), and agentic-commerce is not on
# public Packagist, so a composer install would fail.
# assets: disabled — the admin bundle is committed prebuilt under
# src/Resources/public/administration, so packaging ships it as-is (no rebuild).
build:
  zip:
    composer:
      enabled: false
    assets:
      enabled: false
