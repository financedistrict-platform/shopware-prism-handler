# Pin shopware-cli behaviour to a known date (silences the default-date warning).
compatibility_date: '2026-02-11'

# shopware-cli build config for `shopware-cli extension zip`.
#
# This plugin has NO third-party composer dependencies (it only requires
# shopware/core + the licensed shopware/agentic-commerce, both provided by the
# platform at runtime) and NO admin/storefront JS. So skip composer install and
# the asset build when packaging — otherwise shopware-cli would try to resolve
# shopware/agentic-commerce, which is not on public Packagist, and fail.
build:
  zip:
    composer:
      enabled: false
    assets:
      enabled: false
